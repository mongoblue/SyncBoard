[pytest]
# ============================================================================
# 基础配置
# ============================================================================

# 测试目录
testpaths = testcases

# 测试文件命名规则
python_files = test_*.py

# 测试类命名规则
python_classes = Test*

# 测试函数命名规则
python_functions = test_*


# ============================================================================
# 运行选项
# ============================================================================

addopts =
    # 详细输出
    -v
    # 显示简短的错误追踪信息
    --tb=short
    # 严格检查 marker 使用
    --strict-markers
    # 禁用警告输出
    --disable-warnings
    # 不显示警告标记
    -p no:warnings
    # 启用颜色输出
    --color=yes
    # 自动打开失败截图/日志（如果有）
    # --pdb


# ============================================================================
# 自定义标记 (markers)
# ============================================================================

markers =
    # 按模块分类
    smoke:      冒烟测试用例 - 核心功能快速验证
    regression: 回归测试用例 - 全面回归验证

    # 按功能模块分类
    login:      登录模块测试
    user:       用户模块测试
    project:    项目模块测试
    order:      订单模块测试
    product:    商品模块测试

    # 按测试类型分类
    api:        API接口测试
    ui:         UI界面测试
    unit:       单元测试
    integration: 集成测试

    # 按执行速度分类
    slow:       执行较慢的测试（>5s）
    fast:       快速测试（<1s）

    # 按优先级分类
    p0:         P0级测试 - 核心业务流程
    p1:         P1级测试 - 重要功能
    p2:         P2级测试 - 一般功能
    p3:         P3级测试 - 边际场景


# ============================================================================
# 日志配置
# ============================================================================

# 启用 CLI 日志输出
log_cli = true

# CLI 日志级别
log_cli_level = INFO

# CLI 日志格式
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s

# CLI 日期格式
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 在日志开头添加空行，提高可读性
log_cli_log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s


# ============================================================================
# 报告配置
# ============================================================================

# Allure 报告结果目录
allure_results_dir = reports/allure-results

# HTML 报告配置（需要 pytest-html）
# html 输出目录
# htmlpath = reports/report.html


# ============================================================================
# 过滤警告
# ============================================================================

filterwarnings =
    # 忽略特定类型的警告
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    # 忽略第三方库的警告
    ignore::requests.packages.urllib3.exceptions.InsecureRequestWarning


# ============================================================================
# 最小 Python 版本
# ============================================================================

minversion = 8.0


# ============================================================================
# 辅助配置
# ============================================================================

# 当测试失败时保留临时文件（用于调试）
# tmpdir_retention_policy = all

# 测试失败时自动进入 PDB 调试（慎用）
# addopts = --pdb

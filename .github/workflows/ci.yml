name: SyncBoard Enterprise CI (Hybrid Strategy)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # ===================================================
  # 任务 1：代码体检 (Lint)
  # 目标：秒级反馈，最快发现语法错误
  # ===================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install flake8
      - run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ===================================================
  # 任务 2：后端单元测试 (API Unit Test)
  # 策略：【速度优先】使用 Service 容器 (企业级标准写法)
  # 理由：API 测试不需要前端界面，用 Service 启动 DB 最快，无需构建镜像
  # ===================================================
  api-test:
    needs: lint
    runs-on: ubuntu-latest
    
    # 定义轻量级服务 (只启动 DB 和 Redis)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: syncboard_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright

      - name: Run API Tests
        working-directory: ./backend
        env:
          # 连接到 Service 容器提供的数据库
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: syncboard_test
        run: |
          # 1. 迁移数据库 (建表)
          python manage.py migrate
          # 2. 跑 API 测试
          pytest tests/

  # ===================================================
  # 任务 3：端到端测试 (E2E Test)
  # 策略：【完整性优先】使用 Docker Compose
  # 理由：Playwright 需要访问 http://localhost 前端页面，必须启动 Nginx/前端容器
  # ===================================================
  e2e-test:
    needs: lint  # 可以和 api-test 并行跑，互不干扰
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 启动全栈环境 (Docker Compose)
      # 这会启动：Backend(8000), Frontend/Nginx(80), MySQL(3306)
      - name: Start Full Stack Environment
        run: |
          docker compose up -d --build
          echo "Waiting for services..."
          sleep 15
          docker compose ps

      # 2. 等待前端页面就绪 (关键步骤！)
      # 确保 Nginx 已经把前端页面跑起来了，避免 Connection Refused
      - name: Check Frontend Availability
        run: |
          timeout 60s bash -c 'until curl -s http://localhost > /dev/null; do sleep 5; done'
          echo "✅ Frontend is up and running!"

      - name: Fix Docker Permissions
        run: |
          echo "Fixing permissions for Docker mounted volumes..."
          sudo chown -R $USER:$USER .
          # 确保 redis_data 和 mysql_data 对当前用户可读可写
          sudo chmod -R 777 redis_data || true
          sudo chmod -R 777 mysql_data || true

      # 3. 准备 Python 环境 (用于运行测试脚本)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright

      # 4. 准备 E2E 数据
      # 注意：这里连接的是 Docker Compose 里的 MySQL
      - name: Prepare E2E Data
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # 注意：Docker 里的数据库名通常是 docker-compose.yml 里配的默认名
          # 如果你的 docker-compose 配置的是 syncboard，这里就写 syncboard
          DB_NAME: syncboard 
        run: |
          # 确保表结构存在
          python manage.py migrate
          # 插入测试数据 (你的自定义命令)
          python manage.py seed_ci_data

      # 5. 安装 Playwright 浏览器
      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps

      # 6. 执行 E2E 测试
      - name: Run E2E Tests
        working-directory: ./
        env:
          # Playwright 访问 Docker 启动的前端
          BASE_URL: http://localhost
          API_URL: http://localhost:8000
        run: |
          pytest e2e/

      - name: Teardown & Clean Up
        if: always()
        run: |
          # 1. 停止容器，并删除 Docker 卷
          docker compose down -v
          
          # 2. 【核武器】直接删除 Docker 生成的 root 权限文件夹
          # 不要试图修改权限了，直接删掉最稳妥
          echo "Removing docker data directories..."
          sudo rm -rf redis_data
          sudo rm -rf mysql_data
          
          # 3. 为防万一，把当前目录下的其他残留文件归还给 Runner 用户
          sudo chown -R $(id -u):$(id -g)

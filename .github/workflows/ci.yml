name: SyncBoard Enterprise CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # -------------------------------------------
  # 任务 1：代码体检 (Lint)
  # 目标：最快速度发现低级错误
  # -------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # 自动利用缓存，下次跑更快

      - name: Install Linter
        run: pip install flake8

      - name: Run Linting
        # 运行 flake8 检查。
        # --count: 统计错误数
        # --max-line-length=127: 允许一行最长127个字符
        # --statistics: 显示统计信息
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # -------------------------------------------
  # 任务 2：业务测试 (Test)
  # 只有当 lint 任务成功后，这里才会开始
  # -------------------------------------------
  test:
    needs: lint  # <--- 关键！这建立了依赖关系
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Docker Services
        run: |
          docker compose up -d --build
          echo "Waiting for MySQL to be ready..."
          sleep 15
          docker compose ps

      - name: Fix DB Permissions
        env:
          THE_DB_PWD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker compose exec -T db mysql -u root -p"$THE_DB_PWD" -e "GRANT ALL PRIVILEGES ON *.* TO 'Liujia'@'%'; FLUSH PRIVILEGES;"

      - name: Run API Tests
        run: |
          docker compose exec -T backend pytest tests/

      - name: Prepare E2E Data
        run: |
          docker compose exec -T backend python manage.py seed_ci_data

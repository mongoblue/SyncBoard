name: SyncBoard Enterprise CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # -------------------------------------------
  # 任务 1：代码体检 (Lint)
  # 目标：最快速度发现低级错误
  # -------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # 自动利用缓存，下次跑更快

      - name: Install Linter
        run: pip install flake8

      - name: Run Linting
        # 运行 flake8 检查。
        # --count: 统计错误数
        # --max-line-length=127: 允许一行最长127个字符
        # --statistics: 显示统计信息
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # -------------------------------------------
  # 任务 2：业务测试 (Test)
  # 只有当 lint 任务成功后，这里才会开始
  # -------------------------------------------
  # -------------------------------------------
  # 任务 2：业务测试 (Test) - 企业级 Service 版
  # -------------------------------------------
  test:
    needs: lint
    runs-on: ubuntu-latest
    # 【重点 1】 定义服务容器
    # GitHub 会自动拉取镜像并在后台启动，相当于帮你 docker run
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: syncboard_test
        ports:
          - 3306:3306
        # 【重点 2】 健康检查 (Health Check)
        # 这就是替代 sleep 15 的黑科技
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        # Redis 的健康检查
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 【重点 3】 不再 build 镜像，直接在宿主机装 Python
      # 配合 cache，以后每次运行只需要几秒钟
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # 开启缓存

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          # 如果你有 mysqlclient 依赖，Ubuntu 可能需要这行，通常默认都有
          # sudo apt-get install -y libmysqlclient-dev
      - name: Apply Migrations
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: syncboard_test
        run: |
          python manage.py migrate
      # 【重点 4】 跑测试
      # 注意：这里我们通过环境变量告诉 Django 数据库在哪里
      - name: Run API Tests
        env:
          # 覆盖 settings.py 里的配置
          # 必须确保你的 Django settings.py 能读取环境变量 (见下文解释)
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: syncboard_test
        run: |
          pytest backend/tests/

      # 【重点 5】 准备数据
      # 同样的，直接用 python 跑，而不是 docker exec
      - name: Prepare E2E Data
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: syncboard_test
        run: |
          python manage.py seed_ci_data

      # 6. 安装 Playwright 浏览器内核
      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      # 7. 启动后端服务 (后台运行)
      # 因为 E2E 测试需要真实访问 API 接口
      - name: Start Backend Server
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: syncboard_test
        run: |
          # nohup 让它在后台跑，& 表示异步执行
          nohup python manage.py runserver 0.0.0.0:8000 &
          # 等待几秒确保启动
          sleep 5

      # 8. 运行 E2E 测试
      - name: Run E2E Tests
        working-directory: ./
        env:
          # 告诉 Playwright 后端地址
          API_URL: http://127.0.0.1:8000
        run: |
          # 确保指向你的 e2e 目录
          pytest e2e/

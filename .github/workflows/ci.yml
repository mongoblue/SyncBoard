name: SyncBoard Enterprise CI (Hybrid Strategy)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # ===================================================
  # 任务 1：代码体检 (Lint)
  # 目标：秒级反馈，最快发现语法错误
  # ===================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install flake8
      - run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ===================================================
  # 任务 2：后端单元测试 (API Unit Test)
  # 策略：【速度优先】使用 Service 容器 (企业级标准写法)
  # 理由：API 测试不需要前端界面，用 Service 启动 DB 最快，无需构建镜像
  # ===================================================
  api-test:
    needs: lint
    runs-on: ubuntu-latest
    
    # 定义轻量级服务 (只启动 DB 和 Redis)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: syncboard_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright

      - name: Run API Tests
        working-directory: ./backend
        env:
          # 连接到 Service 容器提供的数据库
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: syncboard_test
        run: |
          # 1. 迁移数据库 (建表)
          python manage.py migrate
          # 2. 跑 API 测试
          pytest tests/

  # ===================================================
  # 任务 3：端到端测试 (E2E Test)
  # 策略：【完整性优先】使用 Docker Compose
  # 理由：Playwright 需要访问 http://localhost 前端页面，必须启动 Nginx/前端容器
  # ===================================================
  e2e-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 创建 .env 文件 (配置信息)
      - name: Create .env file for Docker
        run: |
          echo "DB_ENGINE=django.db.backends.mysql" >> .env
          echo "DB_NAME=flowspace" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=*" >> .env

      # 👇👇👇【新增】创建 Override 文件，强制容器读取 .env 👇👇👇
      # 这能保证 backend 容器绝对使用我们上面生成的配置，彻底解决“脑裂”
      - name: Create Docker Compose Override
        run: |
          cat <<EOF > docker-compose.override.yml
          services:
            backend:
              env_file:
                - .env
          EOF

      # 2. 启动全栈环境
      # docker compose 会自动读取 docker-compose.override.yml 并应用配置
      - name: Start Full Stack Environment
        run: |
          docker compose up -d --build
          echo "Waiting for services..."
          sleep 15
          docker compose ps

      # 3. 等待前端就绪
      - name: Check Frontend Availability
        run: |
          timeout 60s bash -c 'until curl -s http://localhost > /dev/null; do sleep 5; done'
          echo "✅ Frontend is up and running!"

      # 4. 修复权限
      - name: Fix Docker Permissions
        run: |
          sudo chown -R $USER:$USER .
          sudo chmod -R 777 redis_data || true
          sudo chmod -R 777 mysql_data || true

      # 5. 准备 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright

      # 6. 准备数据 (Runner 视角)
      - name: Prepare E2E Data
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: flowspace
        run: |
          # 1. 手动建库
          docker compose exec -T db mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "CREATE DATABASE IF NOT EXISTS syncboard;"
          # 2. 迁移
          python manage.py migrate
          # 3. 造数据 & 强制改密码
          python manage.py seed_ci_data
          python manage.py shell -c "from django.contrib.auth import get_user_model; User=get_user_model(); u=User.objects.get(username='mongoblue'); u.set_password('13579mnb'); u.save(); print('✅ 密码已强制重置为 13579mnb')"

      # 7. 安装浏览器
      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps

      # 8. 调试登录 (Container 视角)
      # 这次有了 Override 文件，Container 肯定能连上 syncboard 了！
      - name: 🕵️ Debug Login (CSI Investigation)
        run: |
          echo "1. 检查数据库里的用户状态..."
          docker compose exec -T backend python manage.py shell -c "from django.contrib.auth import get_user_model; U=get_user_model(); u=U.objects.get(username='mongoblue'); print(f'User: {u.username}, Active: {u.is_active}, Hash: {u.password[:20]}...')"
          
          echo "----------------------------------------"
          echo "2. 尝试用 CURL 直接登录..."
          curl -v -X POST http://localhost:8000/api/auth/login/ \
            -H "Content-Type: application/json" \
            -d '{"username": "mongoblue", "password": "13579mnb"}'

      # 9. 运行测试
      - name: Run E2E Tests
        working-directory: ./
        env:
          BASE_URL: http://localhost
          API_URL: http://localhost:8000
        run: pytest e2e/

      # 10. 失败时打印日志
      - name: Debug Failure (Print Logs)
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs frontend

  load-test:
    needs: e2e-test  # 等 E2E 跑完再跑这个
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 启动全栈环境 (复用之前的配置)
      - name: Start Full Stack Environment
        run: |
          docker compose up -d --build
          echo "Waiting for services..."
          sleep 15

      # 2. 准备测试数据 (Locust 需要登录，所以必须造号)
      - name: Prepare Load Test Data
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: flowspace # ✅ 必须和 E2E 保持一致
        run: |
          # 2.1 修复权限 (防止 Python 安装报错)
          sudo chown -R $USER:$USER .
          sudo chmod -R 777 ../mysql_data || true
          
          # 2.2 建库 & 迁移
          docker compose exec -T db mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "CREATE DATABASE IF NOT EXISTS flowspace;"
          pip install -r requirements.txt
          pip install zope.event gevent
          python manage.py migrate
          python manage.py seed_ci_data
          
          # 2.3 强制重置密码 (确保 Locust 能登进去)
          python manage.py shell -c "from django.contrib.auth import get_user_model; User=get_user_model(); u=User.objects.get(username='mongoblue'); u.set_password('13579mnb'); u.save()"


      # 4. 运行无头模式 (Headless) 压测
      - name: Run Locust Smoke Test
        run: |
          # 参数策略：
          # -u 50 : 50个并发用户 (对 CI 环境比较友好)
          # -r 5  : 每秒启动5个
          # -t 30s: 只跑30秒，速战速决
          # --headless: 无界面模式
          locust -f backend/locustfile.py \
            --headless \
            -u 50 -r 5 \
            --run-time 30s \
            --host http://localhost:8000

      # 11. 清理
      - name: Teardown & Clean Up
        if: always()
        run: |
          docker compose down -v
          sudo rm -rf redis_data mysql_data

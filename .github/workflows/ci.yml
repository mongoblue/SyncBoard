name: SyncBoard Enterprise CI (Hybrid Strategy)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # ===================================================
  # 任务 1：代码体检 (Lint)
  # 目标：秒级反馈，最快发现语法错误
  # ===================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install flake8
      - run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ===================================================
  # 任务 2：后端单元测试 (API Unit Test)
  # 策略：【速度优先】使用 Service 容器 (企业级标准写法)
  # 理由：API 测试不需要前端界面，用 Service 启动 DB 最快，无需构建镜像
  # ===================================================
  api-test:
    needs: lint
    runs-on: ubuntu-latest
    
    # 定义轻量级服务 (只启动 DB 和 Redis)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: syncboard_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright

      - name: Run API Tests
        working-directory: ./backend
        env:
          # 连接到 Service 容器提供的数据库
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: syncboard_test
        run: |
          # 1. 迁移数据库 (建表)
          python manage.py migrate
          # 2. 跑 API 测试
          pytest tests/

  # ===================================================
  # 任务 3：端到端测试 (E2E Test)
  # 策略：【完整性优先】使用 Docker Compose
  # 理由：Playwright 需要访问 http://localhost 前端页面，必须启动 Nginx/前端容器
  # ===================================================
  e2e-test:
    needs: lint  # 可以和 api-test 并行跑，互不干扰
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 启动全栈环境 (Docker Compose)
      # 这会启动：Backend(8000), Frontend/Nginx(80), MySQL(3306)
      - name: Start Full Stack Environment
        run: |
          docker compose up -d --build
          echo "Waiting for services..."
          sleep 15
          docker compose ps

      # 2. 等待前端页面就绪 (关键步骤！)
      # 确保 Nginx 已经把前端页面跑起来了，避免 Connection Refused
      - name: Check Frontend Availability
        run: |
          timeout 60s bash -c 'until curl -s http://localhost > /dev/null; do sleep 5; done'
          echo "✅ Frontend is up and running!"

      - name: Fix Docker Permissions
        run: |
          echo "Fixing permissions for Docker mounted volumes..."
          sudo chown -R $USER:$USER .
          # 确保 redis_data 和 mysql_data 对当前用户可读可写
          sudo chmod -R 777 redis_data || true
          sudo chmod -R 777 mysql_data || true

      # 3. 准备 Python 环境 (用于运行测试脚本)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright

      # 4. 准备 E2E 数据
      # 注意：这里连接的是 Docker Compose 里的 MySQL
      - name: Prepare E2E Data
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: syncboard
        run: |
          # 1. 【新增】手动创建数据库
          # 使用 docker compose exec 让 db 容器执行创建命令
          # -T 是为了防止 CI 环境报错说“没有终端”
          docker compose exec -T db mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "CREATE DATABASE IF NOT EXISTS syncboard;"
          
          # 2. 迁移数据库 (现在库存在了，这步就能过了)
          python manage.py migrate
          
          # 3. 插入测试数据
          python manage.py seed_ci_data
          python manage.py shell -c "from django.contrib.auth import get_user_model; User=get_user_model(); u=User.objects.get(username='mongoblue'); u.set_password('13579mnb'); u.save(); print('✅ 密码已强制重置为 13579mnb')"
          
          # 5. 【调试手段】打印一下用户，确保存进去了
          python manage.py shell -c "from django.contrib.auth import get_user_model; print('当前数据库用户:', get_user_model().objects.values_list('username', flat=True))"

      # 5. 安装 Playwright 浏览器
      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps

      - name: 🕵️ Debug Login (CSI Investigation)
        run: |
          echo "1. 检查数据库里的用户状态..."
          # 打印用户名、是否激活、密码哈希的前几位
          docker compose exec -T backend python manage.py shell -c "from django.contrib.auth import get_user_model; U=get_user_model(); u=U.objects.get(username='mongoblue'); print(f'User: {u.username}, Active: {u.is_active}, Hash: {u.password[:20]}...')"
          
          echo "----------------------------------------"
          
          echo "2. 尝试用 CURL 直接登录 (模拟 Postman)..."
          # 直接向后端发请求，看看能不能拿到 200 OK
          # 注意：这里假设你的后端返回 JSON。如果是 Session 登录，重点看状态码。
          curl -v -X POST http://localhost:8000/api/auth/login/ \
            -H "Content-Type: application/json" \
            -d '{"username": "mongoblue", "password": "13579mnb"}'
          
          echo "----------------------------------------"

      # 6. 执行 E2E 测试
      - name: Run E2E Tests
        working-directory: ./
        env:
          # Playwright 访问 Docker 启动的前端
          BASE_URL: http://localhost
          API_URL: http://localhost:8000
        run: |
          pytest e2e/

      - name: Debug Failure (Print Logs)
        if: failure()  # 只有上面的测试挂了才运行这一步
        run: |
          echo "==== Backend Logs ===="
          docker compose logs backend
          echo "======================"
          echo "==== Frontend/Nginx Logs ===="
          docker compose logs frontend

      - name: Teardown & Clean Up
        if: always()
        run: |
          # 1. 停止容器，并删除 Docker 卷
          docker compose down -v
          
          # 2. 【核武器】直接删除 Docker 生成的 root 权限文件夹
          # 不要试图修改权限了，直接删掉最稳妥
          echo "Removing docker data directories..."
          sudo rm -rf redis_data
          sudo rm -rf mysql_data

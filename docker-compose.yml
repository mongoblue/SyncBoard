services:
  # 1. 数据库
  db:
    image: mysql:8.0
    container_name: mysql-dev
    restart: always
    environment:
      MYSQL_DATABASE: syncboard
      # 这里配置普通用户（对应你 settings.py 里的 Liujia）
      MYSQL_USER: Liujia
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      # root 密码依然保留，以备不时之需
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # 3. Elasticsearch
  elasticsearch:
    image: elasticsearch:7.17.18
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # 4. Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celery-worker
    command: celery -A backend worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DB_NAME=syncboard
      - DB_USER=Liujia
      - DB_PASSWORD=${MYSQL_PASSWORD:-changeme}
      - DB_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # 连接 ES 需要使用容器名
      - HAYSTACK_URL=http://elasticsearch:9200/
    depends_on:
      - redis
      - db
      - elasticsearch

  # 5. Django backend (uvicorn ASGI) - CI/集成环境使用
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-dev
    command: uvicorn backend.asgi:application --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${DB_NAME:-syncboard}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-${MYSQL_PASSWORD:-root}}
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HAYSTACK_URL=http://elasticsearch:9200/
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started

  # 6. Vue frontend (nginx serving built dist + /api proxy to backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-dev
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  es_data:
  backend_media: